<!-- 🔽 START: View Orders Title -->
<div class="bg-light-primary rounded p-y-20 p-x-24 m-b-24 overflow-hidden ">
    <div class="d-flex">
        <div class="m-t-6">
            <h4 class="page-title m-0 f-s-20 f-w-600 ">
                View Orders
            </h4>
        </div>
    </div>
</div>
<!-- 🔼 END: View Orders Title -->

<!-- 🔽 START: View Orders Filters Section -->
<mat-card class="cardWithShadow">
    <mat-card-content class="p-24">
        <div class="table-responsive">
<div class="d-flex align-items-center w-100 gap-2">
  <mat-form-field appearance="outline" class="flex-grow-1 search-input">
    <mat-label>Search Orders</mat-label>
    <input
      matInput
      placeholder="Search by Order ID or Item"
      autocomplete="off"
      [(ngModel)]="searchText"
      (keyup.enter)="loadOrders(searchText)"
    />
    <button
      mat-icon-button
      matSuffix
       class="suffix-circle-icon"
      aria-label="Search Orders"
      (click)="loadOrders(searchText)"
    >
      <mat-icon>search</mat-icon>
    </button>
  </mat-form-field>

  <button mat-flat-button color="primary" class="filter-btn">
    <mat-icon class="me-1">filter_list</mat-icon>
    Filter
  </button>
</div>




<p-table [value]="dataSource" styleClass="p-datatable-striped w-100 m-t-24" [tableStyle]="{'box-shadow': '0 3px 1px -2px rgba(0,0,0,.2), 0 2px 2px 0 rgba(0,0,0,.14), 0 1px 5px 0 rgba(0,0,0,.12)'}">
    <ng-template pTemplate="header">
        <tr>
            <th>Select</th>
            <!-- <th>Name</th> -->
            <th>Order ID</th>
            <th>Amount</th>
            <th>Status</th>
            <!-- <th>Status</th> -->
        </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-element>
        <tr>
            <td>
                <p-checkbox 
                    [(ngModel)]="element.checked" 
                    (onChange)="onCheckboxChange(element)">
                </p-checkbox>
            </td>
            <!-- <td>{{ element.name }}</td> -->
            <td>{{ element.orderId }}</td>
            <td>{{ element.amount }}</td>
            <!-- <td>{{ element.orderId }}</td> -->
            <td>{{ element.status }}</td>
        </tr>
    </ng-template>
</p-table>
        </div>
    </mat-card-content>
</mat-card>
<!-- 🔼 END: View Orders Filters Section -->
